apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller
  labels:
    strimzi.io/cluster: rucio-frdf
spec:
  replicas: 5
  roles:
    - controller
  storage:
    type: persistent-claim
    size: 50Gi
    deleteClaim: false
    class: controller-local-storage
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    strimzi.io/cluster: rucio-frdf
spec:
  replicas: 5
  roles:
    - broker
  storage:
    type: persistent-claim
    size: 50Gi
    deleteClaim: false
    class: broker-local-storage
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: rucio-frdf
  annotations:
    strimzi.io/kraft: enabled # updated from "migration" to "enabled" to finalize the migration process
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 3.9.0
    replicas: 5
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
      - name: external
        port: 9094
        type: nodeport
        tls: false
    config:
      offsets.topic.replication.factor: 5
      transaction.state.log.replication.factor: 5
      transaction.state.log.min.isr: 2
      default.replication.factor: 5
      min.insync.replicas: 2
    readinessProbe: # (15)
      initialDelaySeconds: 45
      timeoutSeconds: 15
    # Liveness probe (optional)
    livenessProbe:
      initialDelaySeconds: 45
      timeoutSeconds: 15
  entityOperator:
    topicOperator: {}
    userOperator: {}
